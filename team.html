<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FightSMP | Teammitglieder</title>
    <style>
        :root { --bg: #0b0b0c; --card-bg: #131316; --accent: #ff6600; --text: #f5f5f7; --text-muted: #8a8a93; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding-top: 120px; }
        
        nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 10%; background: rgba(19, 19, 22, 0.9); backdrop-filter: blur(10px); position: fixed; width: 100%; top: 0; z-index: 1000; border-bottom: 1px solid rgba(255, 102, 0, 0.1); }
        .logo { font-size: 24px; font-weight: 800; color: var(--accent); text-transform: uppercase; }
        .nav-links { display: flex; list-style: none; gap: 30px; }
        .nav-links a { color: var(--text); text-decoration: none; font-weight: 500; }
        .nav-links a:hover, .nav-links a.active { color: var(--accent); }

        .container { max-width: 1000px; margin: 0 auto; padding: 0 20px; }
        .section-title { font-size: 22px; font-weight: 800; text-transform: uppercase; color: var(--accent); margin: 40px 0 20px 0; letter-spacing: 1px; display: flex; align-items: center; gap: 10px; }
        .section-title::after { content: ''; flex-grow: 1; height: 1px; background: rgba(255,102,0,0.15); }
        
        .team-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .team-card { background: var(--card-bg); border-radius: 8px; padding: 25px; text-align: center; border: 1px solid rgba(255,255,255,0.02); transition: 0.3s; }
        .team-card:hover { transform: translateY(-3px); border-color: rgba(255,102,0,0.3); }
        .team-card img { width: 70px; height: 70px; border-radius: 6px; margin-bottom: 15px; border: 2px solid rgba(255,255,255,0.05); background: #1c1c21; }
        .team-card h3 { font-size: 18px; margin-bottom: 5px; }
        .role-badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .owner-badge { background: rgba(255, 51, 51, 0.1); color: #ff3333; }
        .admin-badge { background: rgba(255, 153, 0, 0.1); color: #ff9900; }
        .sup-badge { background: rgba(51, 153, 255, 0.1); color: #3399ff; }
    </style>
</head>
<body>

    <nav>
        <div class="logo">Fight<span>SMP</span></div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="news.html">News</a></li>
            <li><a href="shop.html">Shop</a></li>
            <li><a href="team.html" class="active">Team</a></li>
            <li><a href="support.html">Support</a></li>
        </ul>
    </nav>

    <div class="container">
        <!-- OWNER (4) -->
        <div class="section-title">Serverleitung / Owner</div>
        <div class="team-grid">
            <div class="team-card">
                <img src="https://crafatar.com/avatars/MHF_Alex?size=70&overlay" alt="Owner Avatar">
                <h3>OwnerName1</h3>
                <span class="role-badge owner-badge">Owner</span>
            </div>
            <div class="team-card">
                <img src="https://crafatar.com/avatars/MHF_Steve?size=70&overlay" alt="Owner Avatar">
                <h3>OwnerName2</h3>
                <span class="role-badge owner-badge">Owner</span>
            </div>
            <div class="team-card">
                <img src="https://crafatar.com/avatars/MHF_Herobrine?size=70&overlay" alt="Owner Avatar">
                <h3>OwnerName3</h3>
                <span class="role-badge owner-badge">Owner</span>
            </div>
            <div class="team-card">
                <img src="https://crafatar.com/avatars/MHF_OakLog?size=70&overlay" alt="Owner Avatar">
                <h3>OwnerName4</h3>
                <span class="role-badge owner-badge">Owner</span>
            </div>
        </div>

        <!-- ADMINS (2) -->
        <div class="section-title">Administration</div>
        <div class="team-grid">
            <div class="team-card">
                <img src="https://crafatar.com/avatars/MHF_Villager?size=70&overlay" alt="Admin Avatar">
                <h3>AdminName1</h3>
                <span class="role-badge admin-badge">Admin</span>
            </div>
            <div class="team-card">
                <img src="https://crafatar.com/avatars/MHF_Golem?size=70&overlay" alt="Admin Avatar">

        <!-- SUPPORTER (4) -->

            <div class="team-card">
                <img src="https://crafatar.com/avatars/MHF_Enderman?size=70&overlay" alt="Support Avatar">
                <h3>SupName1</h3>
                <span class="role-badge sup-badge">Support</span>
            </div>
            <div class="team-card">
                <img src="https://crafatar.com/avatars/MHF_Creeper?size=70&overlay" alt="Support Avatar">
                <h3>SupName2</h3>
                <span class="role-badge sup-badge">Support</span>
            </div>
            <div class="team-card">
                <img src="https://crafatar.com/avatars/MHF_Pig?size=70&overlay" alt="Support Avatar">
                <h3>SupName3</h3>
                <span class="role-badge sup-badge">Support</span>
            </div>
            <div class="team-card">
                <img src="https://crafatar.com/avatars/MHF_Cow?size=70&overlay" alt="Support Avatar">
                <h3>SupName4</h3>
                <span class="role-badge sup-badge">Support</span>
            </div>
        </div>
    </div>

</body>
</html>
