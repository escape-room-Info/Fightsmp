<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FightSMP | News</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .news-wrapper { display: flex; flex-direction: column; gap: 30px; max-width: 850px; margin: 0 auto; }
        .news-card { padding: 35px; transition: transform 0.3s ease, border-color 0.3s ease; }
        .news-card:hover { border-color: rgba(255, 102, 0, 0.3); transform: translateY(-2px); }
        .news-date { font-size: 12px; color: var(--accent); font-weight: 700; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
        .news-card h2 { font-size: 26px; margin-bottom: 14px; font-weight: 800; letter-spacing: -0.3px; }
        .news-card p { color: var(--text-muted); line-height: 1.7; font-size: 15px; }
        .news-author { margin-top: 25px; font-size: 13px; color: rgba(255,255,255,0.25); border-top: 1px solid rgba(255,255,255,0.04); padding-top: 15px; }
        
        /* Skeleton Loader */
        .skeleton { height: 20px; background: rgba(255,255,255,0.03); border-radius: 4px; position: relative; overflow: hidden; }
        .skeleton::after { content: ''; position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.04), transparent); animation: wave 1.6s infinite; }
        @keyframes wave { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
    </style>
</head>
<body>

    <nav>
        <div class="logo">Fight<span>SMP</span></div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="news.html" class="active">News</a></li>
            <li><a href="shop.html">Shop</a></li>
            <li><a href="team.html">Team</a></li>
            <li><a href="support.html">Support</a></li>
            <li><a href="login.php" class="btn-login">Login</a></li>
        </ul>
    </nav>

    <div class="container">
        <h1 class="page-title">Ankündigungen</h1>
        <p class="subtitle">Updates, Patches und Events auf dem Netzwerk.</p>
        
        <div class="news-wrapper" id="news-container">
            <div class="glass-card news-card">
                <div class="skeleton" style="width: 25%; margin-bottom: 15px;"></div>
                <div class="skeleton" style="width: 60%; height: 32px; margin-bottom: 15px;"></div>
                <div class="skeleton" style="width: 100%; height: 80px;"></div>
            </div>
        </div>
    </div>

    <script>
        fetch('news-api.php')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('news-container');
                container.innerHTML = '';
                if(data.length === 0) {
                    container.innerHTML = '<p style="color: var(--text-muted); text-align:center;">Aktuell gibt es keine aktiven Beiträge.</p>';
                    return;
                }
                data.forEach(item => {
                    container.innerHTML += `
                        <div class="glass-card news-card">
                            <div class="news-date">${item.created_at}</div>
                            <h2>${item.title}</h2>
                            <p>${item.content.replace(/\n/g, '<br>')}</p>
                            <div class="news-author">Veröffentlicht von <span style="color: var(--text); font-weight: 600;">${item.author}</span></div>
                        </div>
                    `;
                });
            });
    </script>
</body>
</html>
