<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FightSMP | Live Support</title>
    <style>
        :root { --bg: #0b0b0c; --card-bg: #131316; --accent: #ff6600; --text: #f5f5f7; --text-muted: #8a8a93; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding-top: 110px; height: 100vh; display: flex; flex-direction: column; }
        
        nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 10%; background: rgba(19, 19, 22, 0.9); backdrop-filter: blur(10px); position: fixed; width: 100%; top: 0; z-index: 1000; border-bottom: 1px solid rgba(255, 102, 0, 0.1); }
        .logo { font-size: 24px; font-weight: 800; color: var(--accent); text-transform: uppercase; }
        .nav-links { display: flex; list-style: none; gap: 30px; }
        .nav-links a { color: var(--text); text-decoration: none; font-weight: 500; }
        .nav-links a:hover, .nav-links a.active { color: var(--accent); }

        .chat-container { max-width: 700px; width: 100%; margin: auto; background: var(--card-bg); border-radius: 12px; border: 1px solid rgba(255,255,255,0.03); display: flex; flex-direction: column; height: 75vh; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        .chat-header { background: rgba(255, 102, 0, 0.05); padding: 20px; border-bottom: 1px solid rgba(255,102,0,0.1); border-top-left-radius: 12px; border-top-right-radius: 12px; display: flex; align-items: center; gap: 12px; }
        .bot-status { width: 10px; height: 10px; background: #00ff66; border-radius: 50%; box-shadow: 0 0 10px #00ff66; }
        
        .chat-messages { flex-grow: 1; padding: 25px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .msg { max-width: 75%; padding: 12px 16px; border-radius: 8px; font-size: 15px; line-height: 1.5; }
        .msg.bot { background: rgba(255,255,255,0.03); align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid rgba(255,255,255,0.02); }
        .msg.user { background: var(--accent); color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        
        .chat-input-area { padding: 20px; border-top: 1px solid rgba(255,255,255,0.03); display: flex; gap: 10px; }
        .chat-input-area input { flex-grow: 1; background: #1c1c21; border: 1px solid rgba(255,255,255,0.05); padding: 14px; border-radius: 6px; color: white; font-size: 15px; }
        .chat-input-area input:focus { outline: none; border-color: var(--accent); }
        .chat-input-area button { background: var(--accent); border: none; color: white; padding: 0 25px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .chat-input-area button:hover { background: #e05500; }
    </style>
</head>
<body>

    <nav>
        <div class="logo">Fight<span>SMP</span></div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="news.html">News</a></li>
            <li><a href="shop.html">Shop</a></li>
            <li><a href="team.html">Team</a></li>
            <li><a href="support.html" class="active">Support</a></li>
        </ul>
    </nav>

    <div class="chat-container">
        <div class="chat-header">
            <div class="bot-status"></div>
            <div>
                <strong style="font-size: 16px;">FightBot Support-Assistent</strong>
                <div style="font-size: 12px; color: var(--text-muted);">Automatisiert & Live-Hilfe</div>
            </div>
        </div>
        <div class="chat-messages" id="chat-box">
            <div class="msg bot">Hallo! Ich bin der FightSMP Support-Bot. Wie kann ich dir heute helfen? (Frage mich nach "Rang", "Link", "IP" oder "Support")</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="user-input" placeholder="Schreibe eine Nachricht..." onkeypress="if(event.key === 'Enter') sendMsg()">
            <button onclick="sendMsg()">Senden</button>
        </div>
    </div>

    <script>
        function sendMsg() {
            const input = document.getElementById('user-input');
            const chatBox = document.getElementById('chat-box');
            const val = input.value.trim();
            if(!val) return;

            // User-Nachricht hinzufügen
            chatBox.innerHTML += `<div class="msg user">${val}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // Bot-Antwort Logik
            setTimeout(() => {
                let reply = "Entschuldigung, das habe ich nicht verstanden. Schreibe 'Support', um Hilfe zu erhalten.";
                const lower = val.toLowerCase();
                
                if (lower.includes('rang') || lower.includes('shop') || lower.includes('kaufen')) {
                    reply = "Im unserem Web-Shop findest du die Ränge <b>Prime</b>, <b>Prime+</b> und den ultimativen <b>Fight-Rang</b> (mit dem du sogar eigene private Server erstellen kannst!).";
                } else if (lower.includes('link') || lower.includes('code') || lower.includes('anmelden')) {
                    reply = "Gehe einfach auf den Minecraft-Server und gib <b>/link</b> in den Chat ein. Du erhältst einen Code, den du auf unserer Login-Seite zusammen mit deinem Namen eingeben kannst.";
                } else if (lower.includes('ip') || lower.includes('joinen')) {
                    reply = "Die Server-IP lautet: <b style='color:#ff6600;'>fightsmp.de</b> (Version 1.20+).";
                } else if (lower.includes('support') || lower.includes('hilfe') || lower.includes('admin')) {
                    reply = "Falls du ein größeres Problem hast, wende dich bitte auf unserem Discord an einen unserer 4 Supporter, 2 Admins oder 4 Owner!";
                }

                chatBox.innerHTML += `<div class="msg bot">${reply}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 600);
        }
    </script>
</body>
</html>
